name: ai-gateway

on:
  push:
    branches: [main]
    paths: ["services/ai-gateway/**", ".github/workflows/ai-gateway.yml"]
  pull_request:
    paths: ["services/ai-gateway/**", ".github/workflows/ai-gateway.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
