name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Control Plane tests
        working-directory: services/control-plane
        run: mvn -B test

  python-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements*.txt

      - name: Install dependencies (runtime + test)
        working-directory: services/ai-gateway
        run: pip install -r requirements-dev.txt

      - name: Run AI Gateway tests
        working-directory: services/ai-gateway
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build web app
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: |
          test -f README.md
          test -f services/control-plane/pom.xml
          test -f services/control-plane/src/main/resources/db/migration/V2__create_session_domain.sql
          test -f services/ai-gateway/requirements.txt
          test -f apps/web/package.json
          test -f contracts/openapi/control-plane.yaml
          test -f contracts/openapi/ai-gateway.yaml
          test -f docker-compose.yml
          test -f docs/architecture.md
          # Guard against a module and a package with the same name shadowing each other.
          ! test -d services/ai-gateway/app/rag
