name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Control Plane tests
        working-directory: services/control-plane
        run: mvn -B test

  python-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements.txt

      - name: Install dependencies
        working-directory: services/ai-gateway
        run: pip install -r requirements.txt

      - name: Run Python tests
        working-directory: services/ai-gateway
        run: pytest

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: |
          test -f README.md
          test -f services/control-plane/pom.xml
          test -f services/control-plane/src/main/resources/db/migration/V2__create_session_domain.sql
          test -f services/ai-gateway/requirements.txt
          test -f apps/web/package.json
          test -f contracts/openapi/control-plane.yaml
          test -f docker-compose.yml
