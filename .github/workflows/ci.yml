name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Control Plane tests
        working-directory: services/control-plane
        run: mvn -B test
      - name: Build Control Plane artifact
        working-directory: services/control-plane
        run: mvn -B -DskipTests package

  python-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-gateway/requirements*.txt
      - name: Install dependencies
        working-directory: services/ai-gateway
        run: pip install -r requirements-dev.txt
      - name: Run Python tests
        working-directory: services/ai-gateway
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [control-plane, python-gateway, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build Control Plane image
        run: docker build -t orvexa/control-plane:ci ./services/control-plane
      - name: Build AI Gateway image
        run: docker build -t orvexa/ai-gateway:ci ./services/ai-gateway
      - name: Build Web image
        run: docker build -t orvexa/web:ci ./apps/web

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: |
          test -f README.md
          test -f services/control-plane/pom.xml
          test -f services/control-plane/Dockerfile
          test -f services/control-plane/src/main/resources/db/migration/V2__create_session_domain.sql
          test -f services/ai-gateway/requirements.txt
          test -f apps/web/package.json
          test -f apps/web/Dockerfile
          test -f contracts/openapi/control-plane.yaml
          test -f docker-compose.yml
