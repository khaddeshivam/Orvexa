services:
  postgres:
    image: postgres:17-alpine
    container_name: orvexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orvexa}
      POSTGRES_USER: ${POSTGRES_USER:-orvexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orvexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orvexa} -d ${POSTGRES_DB:-orvexa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: orvexa-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: orvexa-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

  ai-gateway:
    build:
      context: ./services/ai-gateway
    container_name: orvexa-ai-gateway
    restart: unless-stopped
    ports:
      - "${AI_GATEWAY_PORT:-8000}:8000"
    environment:
      GATEWAY_INTERNAL_API_KEY: ${ORVEXA_INTERNAL_API_KEY:-local-internal-key}
      GATEWAY_QDRANT_URL: http://qdrant:6333
      GATEWAY_OLLAMA_BASE_URL: http://ollama:11434
      GATEWAY_OLLAMA_MODEL: ${GATEWAY_OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - fastembed-models:/models
    depends_on:
      - qdrant
      - ollama

volumes:
  orvexa-postgres-data:
  qdrant-data:
  ollama-data:
  fastembed-models:
