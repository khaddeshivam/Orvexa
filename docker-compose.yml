services:
  postgres:
    image: postgres:17-alpine
    container_name: orvexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orvexa}
      POSTGRES_USER: ${POSTGRES_USER:-orvexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orvexa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orvexa} -d ${POSTGRES_DB:-orvexa}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orvexa-postgres-data:
