spring:
  application:
    name: orvexa-control-plane

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orvexa}
    username: ${SPRING_DATASOURCE_USERNAME:orvexa}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${CONTROL_PLANE_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

orvexa:
  security:
    api-key: ${ORVEXA_API_KEY:local-api-key}
    internal-api-key: ${ORVEXA_INTERNAL_API_KEY:local-internal-key}
